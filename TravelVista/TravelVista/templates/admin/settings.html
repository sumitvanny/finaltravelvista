{% extends "admin/admin_base.html" %}
{% block title %}Settings — TravelVista Admin{% endblock %}
{% block content %}
<div class="admin-topbar"><h1>Settings</h1></div>

<div class="grid" style="grid-template-columns: 1fr 1fr;">
  <div class="card">
    <h3>Change Your Password</h3>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="new_password">New Password</label>
        <input type="password" name="new_password" id="new_password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary">Update Password</button>
    </form>
  </div>

  <div class="card">
    <h3>Admin Accounts</h3>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Username</th><th>Email</th><th>Role</th></tr></thead>
        <tbody>
          {% for a in admins %}
          <tr><td>{{ a.username }}</td><td>{{ a.email }}</td><td><span class="badge badge-gold">{{ a.role|title }}</span></td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
